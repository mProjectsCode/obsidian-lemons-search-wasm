name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          toolchain: nightly
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Pack package
        run: make pack-release
      - name: Rename package tarball
        run: |
          mv lemons_dev-lemons-search-*.tgz "lemons-search-${GITHUB_REF_NAME}.tgz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "lemons-search-${GITHUB_REF_NAME}.tgz" --verify-tag --title "${GITHUB_REF_NAME}"
